name: auto-approve
on: pull_request
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr review "$PR" --approve --body "approved by github-actions bot"
